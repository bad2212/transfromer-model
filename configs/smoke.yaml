# Tiny end-to-end run for local checks (CPU/MPS, ~15 min). Not for results.
seed: 42
work_dir: work_smoke
out_dir: checkpoints/smoke

data:
  max_pairs: 100000
  min_char_ratio: 0.4
  max_char_ratio: 2.5
  max_chars: 1000
  max_tokens: 128

tokenizer:
  vocab_size: 8000
  model_type: unigram
  sample_sentences: 200000
  src_sampling_alpha: 0.1

model:
  d_model: 256
  n_heads: 4
  d_ff: 1024
  enc_layers: 3
  dec_layers: 3
  dropout: 0.1
  pos: rope
  max_len: 512

train:
  batch_tokens: 4096
  accum_steps: 1
  lr: 0.001
  warmup_steps: 500
  label_smoothing: 0.1
  clip_norm: 1.0
  max_steps: 3000
  max_hours: 0.5
  eval_every: 500
  ckpt_every: 500
  keep_ckpts: 2
  num_workers: 0

decode:
  beam: 4
  len_penalty: 1.0
  max_len_a: 1.5
  max_len_b: 10
  split_over_tokens: 128

wandb:
  project: fr-en-transformer
  enabled: false
